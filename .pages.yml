# Pages CMS Configuration (https://pagescms.org)
# حاتي المجنون (العبور الجديدة) - نظام إدارة المحتوى الرقمي

media:
  input: images
  output: images

content:
  - name: business
    label: "بيانات المطعم والإعلانات والاتصال"
    type: file
    path: data/business.json
    format: json
    fields:
      - name: name
        label: "اسم المطعم"
        type: string
      - name: branch
        label: "اسم الفرع أو المنطقة"
        type: string
      - name: announcement
        label: "الشريط الإعلاني أعلى الموقع (اتركه فارغاً لإخفائه)"
        type: string
      - name: heroTitle
        label: "عنوان الواجهة الرئيسي (الهيرو)"
        type: string
      - name: slogan
        label: "الشعار التسويقي"
        type: string
      - name: description
        label: "وصف المطعم والفقرة الترحيبية"
        type: text
      - name: address
        label: "العنوان بالكامل"
        type: string
      - name: locationLandmark
        label: "أقرب علامة مميزة للمحل"
        type: string
      - name: phonePrimary
        label: "رقم الموبايل الأساسي (للاتصال والفوتر)"
        type: string
      - name: phoneSecondary
        label: "رقم إضافي 1"
        type: string
      - name: phoneThird
        label: "رقم إضافي 2"
        type: string
      - name: whatsapp
        label: "رقم الواتساب للطلبات"
        type: string
      - name: workingHours
        label: "مواعيد العمل اليومية"
        type: string
      - name: deliveryAreas
        label: "أحياء ومناطق التوصيل (مفصولة بفواصل)"
        type: text
      - name: deliveryNote
        label: "ملاحظة خدمة التوصيل بالفوتر"
        type: string
      - name: feastPricePerKilo
        label: "سعر كيلو المشاوي في حاسبة العزومات (ج.م)"
        type: number
      - name: googleMapsUrl
        label: "رابط خرائط جوجل (Google Maps)"
        type: string
      - name: googleRating
        label: "التقييم الحالي في جوجل (من 5)"
        type: number
      - name: googleReviewCount
        label: "إجمالي عدد تقييمات جوجل"
        type: number
      - name: priceRange
        label: "متوسط السعر للشخص"
        type: string

  - name: categories
    label: "أقسام وتصنيفات المنيو"
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: id
        label: "معرف القسم بالإنجليزية (مثل: grills_kilo, family_feasts)"
        type: string
      - name: name
        label: "اسم القسم بالعربية"
        type: string
      - name: description
        label: "وصف مختصر للقسم"
        type: string

  - name: products
    label: "قائمة المأكولات والمشويات"
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: "كود الصنف (مثل: prod-014)"
        type: string
      - name: name
        label: "اسم الطبق أو الوجبة"
        type: string
      - name: category
        label: "القسم"
        type: select
        options:
          values:
            - family_feasts
            - grills_kilo
            - chicken_meals
            - single_meals
            - sides_casseroles
      - name: price
        label: "السعر الأصلي (ج.م)"
        type: number
      - name: discountPrice
        label: "سعر الخصم / العرض (اختياري)"
        type: number
      - name: unit
        label: "الوحدة أو الحجم (مثل: 1 كجم / صينية / وجبة)"
        type: string
      - name: weightInfo
        label: "تفاصيل الوزن الدقيق"
        type: string
      - name: description
        label: "وصف الصنف"
        type: text
      - name: image
        label: "مسار الصورة (مثل: images/chicken_rice.jpg)"
        type: string
      - name: badge
        label: "شارة تسويقية (مثل: الأكثر مبيعاً 🔥)"
        type: string
      - name: isAvailable
        label: "متوفر للطلب الآن؟"
        type: boolean
        default: true
      - name: isFeatured
        label: "مميز في الصفحة الرئيسية؟"
        type: boolean
        default: false

  - name: offers
    label: "العروض الأسبوعية والخصومات"
    type: file
    path: data/offers.json
    format: json
    list: true
    fields:
      - name: id
        label: "معرف العرض"
        type: string
      - name: title
        label: "عنوان العرض"
        type: string
      - name: badge
        label: "شارة العرض"
        type: string
      - name: originalPrice
        label: "السعر قبل الخصم (ج.م)"
        type: number
      - name: salePrice
        label: "السعر المخفض (ج.م)"
        type: number
      - name: description
        label: "تفاصيل العرض"
        type: text
      - name: period
        label: "فترة العرض"
        type: string
      - name: image
        label: "مسار الصورة"
        type: string
      - name: highlight
        label: "أبرز ميزة"
        type: string

  - name: reviews
    label: "آراء وتقييمات العملاء"
    type: file
    path: data/reviews.json
    format: json
    list: true
    fields:
      - name: id
        label: "رقم المراجعة"
        type: string
      - name: author
        label: "اسم العميل"
        type: string
      - name: rating
        label: "التقييم من 5 نجوم"
        type: number
      - name: date
        label: "تاريخ المراجعة"
        type: string
      - name: orderType
        label: "نوع الطلب (توصيل / سفري / صالة)"
        type: string
      - name: comment
        label: "تعليق العميل"
        type: text
      - name: responseFromOwner
        label: "رد إدارة المطعم"
        type: text
