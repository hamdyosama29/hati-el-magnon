# Pages CMS Configuration (https://pagescms.org)
# حاتي المجنون (العبور الجديدة) - نظام إدارة المحتوى الرقمي

media:
  input: images
  output: images

content:
  - name: business
    label: "بيانات المطعم والاتصال والتوصيل"
    type: file
    path: data/business.json
    format: json
    fields:
      - name: name
        label: "اسم المطعم"
        type: string
      - name: branch
        label: "الفرع"
        type: string
      - name: slogan
        label: "الشعار التسويقي"
        type: string
      - name: description
        label: "وصف المطعم"
        type: text
      - name: address
        label: "العنوان بالكامل"
        type: string
      - name: locationLandmark
        label: "أقرب علامة مميزة"
        type: string
      - name: phonePrimary
        label: "رقم الموبايل الأساسي"
        type: string
      - name: phoneSecondary
        label: "رقم إضافي 1"
        type: string
      - name: phoneThird
        label: "رقم إضافي 2"
        type: string
      - name: whatsapp
        label: "رقم الواتساب للطلبات"
        type: string
      - name: workingHours
        label: "مواعيد العمل اليومية"
        type: string
      - name: googleMapsUrl
        label: "رابط خرائط جوجل"
        type: string
      - name: googleRating
        label: "التقييم الحالي في جوجل"
        type: number
      - name: googleReviewCount
        label: "إجمالي عدد التقييمات"
        type: number
      - name: priceRange
        label: "متوسط السعر للشخص"
        type: string

  - name: products
    label: "قائمة المأكولات والمشويات"
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: "كود الصنف"
        type: string
      - name: name
        label: "اسم الطبق أو الوجبة"
        type: string
      - name: category
        label: "القسم"
        type: select
        options:
          values:
            - family_feasts
            - grills_kilo
            - chicken_meals
            - single_meals
            - sides_casseroles
      - name: price
        label: "السعر الأصلي (ج.م)"
        type: number
      - name: discountPrice
        label: "سعر الخصم / العرض"
        type: number
      - name: unit
        label: "الوحدة أو الحجم"
        type: string
      - name: weightInfo
        label: "تفاصيل الوزن الدقيق"
        type: string
      - name: description
        label: "وصف الصنف"
        type: text
      - name: image
        label: "مسار الصورة"
        type: string
      - name: badge
        label: "شارة تسويقية (مثل: الأكثر مبيعاً 🔥)"
        type: string
      - name: isAvailable
        label: "متوفر للطلب الآن؟"
        type: boolean
        default: true
      - name: isFeatured
        label: "مميز في الصفحة الرئيسية؟"
        type: boolean
        default: false

  - name: offers
    label: "العروض الأسبوعية والخصومات"
    type: file
    path: data/offers.json
    format: json
    list: true
    fields:
      - name: id
        label: "معرف العرض"
        type: string
      - name: title
        label: "عنوان العرض"
        type: string
      - name: badge
        label: "شارة العرض"
        type: string
      - name: originalPrice
        label: "السعر قبل الخصم"
        type: number
      - name: salePrice
        label: "السعر المخفض"
        type: number
      - name: description
        label: "تفاصيل العرض"
        type: text
      - name: period
        label: "فترة العرض"
        type: string
      - name: image
        label: "صورة العرض"
        type: string
      - name: highlight
        label: "أبرز ميزة"
        type: string

  - name: reviews
    label: "آراء وتقييمات العملاء"
    type: file
    path: data/reviews.json
    format: json
    list: true
    fields:
      - name: id
        label: "رقم المراجعة"
        type: string
      - name: author
        label: "اسم العميل"
        type: string
      - name: rating
        label: "التقييم من 5 نجوم"
        type: number
      - name: date
        label: "تاريخ المراجعة"
        type: string
      - name: orderType
        label: "نوع الطلب"
        type: string
      - name: comment
        label: "تعليق العميل"
        type: text
      - name: responseFromOwner
        label: "رد إدارة المطعم"
        type: text
