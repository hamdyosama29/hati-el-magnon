# Pages CMS Configuration (https://pagescms.org)
# حاتي المجنون (العبور الجديدة) - نظام إدارة المحتوى الرقمي

media:
  input: images
  output: images

content:
  - name: business
    label: "بيانات المطعم والاتصال والتوصيل"
    type: file
    path: data/business.json
    fields:
      - name: name
        label: "اسم المطعم"
        type: string
        required: true
      - name: branch
        label: "الفرع"
        type: string
      - name: slogan
        label: "الشعار التسويقي"
        type: string
      - name: description
        label: "وصف المطعم"
        type: text
      - name: address
        label: "العنوان بالكامل"
        type: string
        required: true
      - name: locationLandmark
        label: "أقرب علامة مميزة"
        type: string
      - name: phonePrimary
        label: "رقم الموبايل الأساسي"
        type: string
        required: true
      - name: phoneSecondary
        label: "رقم إضافي 1"
        type: string
      - name: phoneThird
        label: "رقم إضافي 2"
        type: string
      - name: whatsapp
        label: "رقم الواتساب للطلبات"
        type: string
        required: true
      - name: workingHours
        label: "مواعيد العمل اليومية"
        type: string
      - name: googleMapsUrl
        label: "رابط خرائط جوجل"
        type: string
      - name: googleRating
        label: "التقييم الحالي في جوجل"
        type: number
      - name: googleReviewCount
        label: "إجمالي عدد التقييمات"
        type: number
      - name: priceRange
        label: "متوسط السعر للشخص"
        type: string

  - name: products
    label: "قائمة المأكولات والمشويات"
    type: file
    path: data/products.json
    list:
      summary: "{name} ({price} ج.م)"
    fields:
      - name: id
        label: "كود الصنف (فريد، مثلاً: prod-014)"
        type: string
        required: true
      - name: name
        label: "اسم الطبق أو الصنف"
        type: string
        required: true
      - name: category
        label: "القسم"
        type: select
        options:
          values:
            - name: family_feasts
              label: "صواني العزومات واللمة"
            - name: grills_kilo
              label: "مشويات بلدي بالكيلو"
            - name: chicken_meals
              label: "فراخ وشيش على الفحم"
            - name: single_meals
              label: "وجبات فردية وسريعة"
            - name: sides_casseroles
              label: "طواجن ومقبلات وسلطات"
      - name: price
        label: "السعر الأصلي (ج.م)"
        type: number
        required: true
      - name: discountPrice
        label: "سعر الخصم / العرض (اختياري)"
        type: number
      - name: unit
        label: "الوحدة أو الحجم (مثال: صينية 4 أفراد / 1 كجم / وجبة)"
        type: string
      - name: weightInfo
        label: "تفاصيل الوزن الدقيق والقطع"
        type: string
      - name: description
        label: "وصف مفصل للطبق والبهارات"
        type: text
      - name: ingredients
        label: "المكونات الأساسية"
        type: string
        list: true
      - name: image
        label: "مسار صورة الصنف"
        type: string
      - name: badge
        label: "شارة تسويقية (مثل: الأكثر مبيعاً 🔥)"
        type: string
      - name: isAvailable
        label: "متوفر للطلب الآن؟"
        type: boolean
        default: true

  - name: offers
    label: "العروض الأسبوعية والخصومات"
    type: file
    path: data/offers.json
    list:
      summary: "{title}"
    fields:
      - name: id
        label: "معرف العرض"
        type: string
      - name: title
        label: "عنوان العرض"
        type: string
      - name: badge
        label: "شارة العرض"
        type: string
      - name: originalPrice
        label: "السعر قبل الخصم"
        type: number
      - name: salePrice
        label: "السعر المخفض"
        type: number
      - name: description
        label: "تفاصيل العرض والمحتويات"
        type: text
      - name: period
        label: "فترة سريان العرض"
        type: string
      - name: image
        label: "صورة العرض"
        type: string
      - name: highlight
        label: "أبرز ميزة"
        type: string

  - name: reviews
    label: "آراء وتقييمات العملاء"
    type: file
    path: data/reviews.json
    list:
      summary: "{author} ({rating} نجوم)"
    fields:
      - name: id
        label: "رقم المراجعة"
        type: string
      - name: author
        label: "اسم العميل"
        type: string
      - name: rating
        label: "التقييم من 5 نجوم"
        type: number
      - name: date
        label: "تاريخ المراجعة"
        type: string
      - name: orderType
        label: "نوع الطلب (توصيل / سفري / صالة)"
        type: string
      - name: comment
        label: "تعليق وملاحظة العميل"
        type: text
      - name: responseFromOwner
        label: "رد إدارة المطعم"
        type: text
