<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Background glowing emblem -->
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grill Emblem Icon -->
  <g transform="translate(15, 12)">
    <circle cx="38" cy="38" r="36" fill="#1C1917" stroke="#F59E0B" stroke-width="2.5" />
    <!-- Grill Grate -->
    <path d="M16 38h44M20 28h36M20 48h36M26 18h24M26 58h24" stroke="#44403C" stroke-width="2" stroke-linecap="round" />
    <!-- Central Charcoal Fire Flame -->
    <path d="M38 16c4 8 10 12 10 20a10 10 0 0 1-20 0c0-6 4-12 10-20z" fill="url(#flameGrad)" filter="url(#glow)" />
    <!-- Skewer / Fork elements -->
    <path d="M26 52l24-24M24 28l24 24" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Arabic Typography for "حاتي المجنون" -->
  <text x="105" y="52" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="0">
    حاتي <tspan fill="#F59E0B">المجنون</tspan>
  </text>
  <text x="107" y="78" font-family="'Tajawal', sans-serif" font-weight="600" font-size="14" fill="#F87171" letter-spacing="1">
    العبور الجديدة • أصل المشويات على الفحم
  </text>
  <!-- Small Star Badge -->
  <g transform="translate(370, 32)">
    <circle cx="16" cy="16" r="16" fill="#DC2626" />
    <path d="M16 6l3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z" fill="#FEF08A" />
  </g>
</svg>
